<script id="knowledge-data" type="application/json">{"docs":[{"id":"tips","title":"Tips · Kiến thức kiến trúc và AI cập nhật liên tục","cat":"tips","file":"","kind":"editorial","desc":"Bài viết ngắn về kiến trúc, .NET và AI agent từ nhiều nguồn, kèm quy trình cập nhật liên tục.","body":"\u003ch1 id=\"tips-s0\">Tips · Kiến thức kiến trúc và AI cập nhật liên tục\u003c/h1>\n\u003cp>Mục này gom các bài viết ngắn, thực dụng về kiến trúc phần mềm, .NET và AI agent từ nhiều nguồn ngoài các thư mục Core knowledge. Khác với tài liệu gốc, đây là danh sách sống — được bổ sung dần mỗi khi có bài viết đáng đọc từ The Architecture Lab, Microsoft, Anthropic, LinkedIn hoặc nguồn khác.\u003c/p>\n\u003cdiv class=\"callout\">\u003cb>Giới hạn khi biên soạn · 11/09/2026\u003c/b>Không thể tải nội dung đầy đủ của 4 liên kết The Architecture Lab vì mạng công ty (Zscaler) chặn truy cập ngoài qua cổng SSO. Tóm tắt bên dưới dựa trên chủ đề tiêu đề bài viết; hãy mở link gốc để đọc đầy đủ trước khi áp dụng vào review hoặc quyết định thiết kế.\u003c/div>\n\u003ch2 id=\"tips-s1\">1. Bốn bài khởi tạo · The Architecture Lab\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Bài viết\u003c/th>\n\u003cth>Chủ đề dự kiến\u003c/th>\n\u003cth>Vì sao đáng đọc\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>3 DDD Patterns\u003c/td>\n\u003ctd>Các mẫu Domain-Driven Design hay tái sử dụng (ví dụ Value Object, Aggregate, Domain Event)\u003c/td>\n\u003ctd>Đối chiếu khi review boundary giữa các module hoặc service .NET\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Agentic Workflow\u003c/td>\n\u003ctd>Thiết kế workflow cho AI agent: lập kế hoạch, gọi tool, kiểm soát vòng lặp và điểm dừng\u003c/td>\n\u003ctd>Liên quan trực tiếp đến việc dùng Copilot/agent trong review và vận hành\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>.NET Development Roadmap (Minimalist Edition)\u003c/td>\n\u003ctd>Lộ trình học .NET rút gọn, tập trung kỹ năng cốt lõi thay vì học dàn trải\u003c/td>\n\u003ctd>Dùng để tự đánh giá khoảng trống kiến thức .NET của bản thân\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Deadly Clean Architecture Mistakes\u003c/td>\n\u003ctd>Các lỗi thường gặp khi áp dụng Clean Architecture (over-abstraction, sai hướng dependency…)\u003c/td>\n\u003ctd>Đối chiếu khi review pull request hoặc thiết kế mới\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Liên kết gốc:\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"https://thearchitecturelab.com/post/3-ddd-patterns\" target=\"_blank\" rel=\"noopener noreferrer\">thearchitecturelab.com/post/3-ddd-patterns\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://thearchitecturelab.com/post/agentic-workflow\" target=\"_blank\" rel=\"noopener noreferrer\">thearchitecturelab.com/post/agentic-workflow\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://thearchitecturelab.com/post/net-development-roadmap-minimalist-edition\" target=\"_blank\" rel=\"noopener noreferrer\">thearchitecturelab.com/post/net-development-roadmap-minimalist-edition\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://thearchitecturelab.com/post/deadly-clean-architecture-mistakes\" target=\"_blank\" rel=\"noopener noreferrer\">thearchitecturelab.com/post/deadly-clean-architecture-mistakes\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"tips-s2\">2. Cách feed nguồn mới vào Tips mỗi ngày/tuần\u003c/h2>\n\u003cp>index.html là file tĩnh, không tự động gọi Internet để lấy bài mới. Có ba cách thực tế để giữ mục này luôn cập nhật, từ đơn giản đến bán tự động:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Cách\u003c/th>\n\u003cth>Thực hiện\u003c/th>\n\u003cth>Khi nào phù hợp\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Thủ công (khuyến nghị để bắt đầu)\u003c/td>\n\u003ctd>Mỗi khi đọc một bài hay, ghi vào bảng Nhật ký Tip bên dưới: ngày, nguồn, chủ đề, 1 câu takeaway, link. Nhờ Copilot mở file này và thêm dòng mới.\u003c/td>\n\u003ctd>Không cần công cụ, kiểm soát chất lượng cao nhất\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Dán nội dung cho Copilot tóm tắt\u003c/td>\n\u003ctd>Mở bài viết trong trình duyệt thật (vì tool fetch của Copilot bị Zscaler chặn), copy nội dung, dán vào chat và yêu cầu tóm tắt rồi thêm vào mục Tips của index.html\u003c/td>\n\u003ctd>Khi mạng công ty chặn fetch tự động nhưng vẫn muốn AI tóm tắt hộ\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Bán tự động qua RSS/cron\u003c/td>\n\u003ctd>Nếu nguồn có RSS (kiểm tra đường dẫn /feed hoặc /rss.xml), dùng Power Automate, GitHub Actions hoặc n8n chạy định kỳ: lấy bài mới, tóm tắt bằng LLM, ghi vào một file JSON riêng rồi chèn vào index.html khi build lại\u003c/td>\n\u003ctd>Khi có nhiều nguồn theo dõi và muốn giảm công sức thủ công\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Nên tổng hợp theo tuần (ví dụ mỗi sáng thứ Hai) thay vì theo ngày, để tránh mục Tips bị loãng bởi tin không quan trọng.\u003c/p>\n\u003ch2 id=\"tips-s3\">3. Nguồn nên theo dõi thêm\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Nguồn\u003c/th>\n\u003cth>Nơi theo dõi\u003c/th>\n\u003cth>Loại nội dung\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Microsoft\u003c/td>\n\u003ctd>Microsoft Learn Blog, .NET Blog (devblogs.microsoft.com/dotnet), Azure Architecture Center - What's new, Azure Updates\u003c/td>\n\u003ctd>Best practice .NET/Azure, tính năng mới, hướng dẫn migration\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Anthropic\u003c/td>\n\u003ctd>anthropic.com/news, Claude release notes, Anthropic engineering blog\u003c/td>\n\u003ctd>Cập nhật model, mẫu thiết kế agent, an toàn AI\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>LinkedIn\u003c/td>\n\u003ctd>Theo dõi tác giả/chủ đề cụ thể (điền tên khi xác định), hashtag #dotnet #cleanarchitecture #AIagents #softwarearchitecture\u003c/td>\n\u003ctd>Góc nhìn thực chiến, tranh luận ngắn, xu hướng\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Khác\u003c/td>\n\u003ctd>The Architecture Lab, Martin Fowler (martinfowler.com), InfoQ, Microsoft DevBlogs, GitHub Blog (AI/Copilot)\u003c/td>\n\u003ctd>Bài phân tích sâu, pattern, case study\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"tips-s4\">4. Mẫu ghi Tip nhanh\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Ngày: \nNguồn: [Microsoft / Anthropic / LinkedIn / The Architecture Lab / khác]\nChủ đề: \nTakeaway (1 câu): \nÁp dụng vào đâu (review / .NET / AI agent / vận hành): \nLink: \u003c/code>\u003c/pre>\n\u003ch2 id=\"tips-s5\">5. Nhật ký Tip\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Ngày\u003c/th>\n\u003cth>Nguồn\u003c/th>\n\u003cth>Chủ đề\u003c/th>\n\u003cth>Takeaway\u003c/th>\n\u003cth>Link\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>11/09/2026\u003c/td>\n\u003ctd>The Architecture Lab\u003c/td>\n\u003ctd>3 DDD Patterns\u003c/td>\n\u003ctd>Cần đọc bài gốc để trích takeaway chính xác (mạng công ty chặn fetch tự động)\u003c/td>\n\u003ctd>\u003ca href=\"https://thearchitecturelab.com/post/3-ddd-patterns\" target=\"_blank\" rel=\"noopener noreferrer\">Mở bài viết ↗\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>11/09/2026\u003c/td>\n\u003ctd>The Architecture Lab\u003c/td>\n\u003ctd>Agentic Workflow\u003c/td>\n\u003ctd>Cần đọc bài gốc để trích takeaway chính xác (mạng công ty chặn fetch tự động)\u003c/td>\n\u003ctd>\u003ca href=\"https://thearchitecturelab.com/post/agentic-workflow\" target=\"_blank\" rel=\"noopener noreferrer\">Mở bài viết ↗\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>11/09/2026\u003c/td>\n\u003ctd>The Architecture Lab\u003c/td>\n\u003ctd>.NET Development Roadmap (Minimalist Edition)\u003c/td>\n\u003ctd>Cần đọc bài gốc để trích takeaway chính xác (mạng công ty chặn fetch tự động)\u003c/td>\n\u003ctd>\u003ca href=\"https://thearchitecturelab.com/post/net-development-roadmap-minimalist-edition\" target=\"_blank\" rel=\"noopener noreferrer\">Mở bài viết ↗\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>11/09/2026\u003c/td>\n\u003ctd>The Architecture Lab\u003c/td>\n\u003ctd>Deadly Clean Architecture Mistakes\u003c/td>\n\u003ctd>Cần đọc bài gốc để trích takeaway chính xác (mạng công ty chặn fetch tự động)\u003c/td>\n\u003ctd>\u003ca href=\"https://thearchitecturelab.com/post/deadly-clean-architecture-mistakes\" target=\"_blank\" rel=\"noopener noreferrer\">Mở bài viết ↗\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Thêm dòng mới lên đầu bảng mỗi khi có Tip mới, giữ nguyên 5 cột để dễ tìm kiếm và đọc lại.\u003c/p>","section":"tips","sections":[{"id":"tips-s0","title":"Tips · Kiến thức kiến trúc và AI cập nhật liên tục","text":" Mục này gom các bài viết ngắn, thực dụng về kiến trúc phần mềm, .NET và AI agent từ nhiều nguồn ngoài các thư mục Core knowledge, được bổ sung dần từ The Architecture Lab, Microsoft, Anthropic, LinkedIn hoặc nguồn khác. Không thể tải nội dung đầy đủ của các liên kết The Architecture Lab vì mạng công ty chặn truy cập ngoài. "},{"id":"tips-s1","title":"1. Bốn bài khởi tạo · The Architecture Lab","text":" 3 DDD Patterns, Agentic Workflow, .NET Development Roadmap Minimalist Edition, Deadly Clean Architecture Mistakes. Liên kết gốc từ thearchitecturelab.com. "},{"id":"tips-s2","title":"2. Cách feed nguồn mới vào Tips mỗi ngày/tuần","text":" Thủ công ghi vào nhật ký Tip, dán nội dung cho Copilot tóm tắt khi mạng chặn fetch tự động, hoặc bán tự động qua RSS và cron với Power Automate, GitHub Actions hoặc n8n. "},{"id":"tips-s3","title":"3. Nguồn nên theo dõi thêm","text":" Microsoft Learn Blog, .NET Blog, Azure Architecture Center, Anthropic news và engineering blog, LinkedIn theo hashtag, The Architecture Lab, Martin Fowler, InfoQ, GitHub Blog. "},{"id":"tips-s4","title":"4. Mẫu ghi Tip nhanh","text":" Mẫu gồm ngày, nguồn, chủ đề, takeaway, áp dụng vào đâu và link. "},{"id":"tips-s5","title":"5. Nhật ký Tip","text":" Bảng ghi các tip theo ngày, nguồn, chủ đề, takeaway và link, bắt đầu với bốn bài từ The Architecture Lab ngày 11/09/2026. "}]},{"id":"monitoring-guide","title":"Monitoring · Dashboard, alerts & incident","cat":"monitoring","file":"","kind":"editorial","desc":"Hướng dẫn áp dụng, câu hỏi review và bằng chứng cần thu thập.","body":"\u003ch1 id=\"monitoring-guide-s0\">Monitoring · Nhìn từ kết quả nghiệp vụ xuống hạ tầng\u003c/h1>\n\u003cp>Thư mục Monitoring chưa có file nguồn tại lần tổng hợp 11/09/2026. Trang này là phần biên soạn bổ sung, liên kết với runbook ACA, tài liệu GCP và sách Production Kubernetes (chương 9, 14). Không có kết nối live hay số liệu production.\u003c/p>\n\u003ch2 id=\"monitoring-guide-s1\">1. Bốn tầng cần xem cùng nhau\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tầng\u003c/th>\n\u003cth>Theo dõi\u003c/th>\n\u003cth>Ý nghĩa và bước tiếp\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Nghiệp vụ\u003c/td>\n\u003ctd>Order/shipment/workflow hoàn tất, thời gian hoàn tất, dữ liệu bị trùng/sai\u003c/td>\n\u003ctd>Pod xanh nhưng đơn không hoàn tất vẫn là incident; chốt phạm vi site/khách hàng\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ứng dụng\u003c/td>\n\u003ctd>Request rate, error rate, p95/p99, dependency timeout\u003c/td>\n\u003ctd>Trace từ API/worker qua SQL, HTTP và messaging để tìm đoạn chậm\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Queue/worker\u003c/td>\n\u003ctd>Oldest task age, backlog, throughput, active jobs, retries, poison tasks\u003c/td>\n\u003ctd>Queue tăng liên tục: so arrival rate với completion rate; CPU có thể vẫn thấp\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Nền tảng\u003c/td>\n\u003ctd>Ready replicas, restarts/OOM, CPU/memory, disk, network/DNS\u003c/td>\n\u003ctd>Đối chiếu requests/limits, event và deploy gần nhất; không đoán bottleneck chỉ từ một biểu đồ\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"monitoring-guide-s2\">2. Từ symptom đến evidence\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Business impact + timestamp + timezone\n  ├── Request / workflow ID → trace → dependency bị lỗi\n  ├── Version / revision → deployment gần nhất\n  ├── Queue age → throughput → worker concurrency\n  └── Pod / replica → events → logs trước restart → resource usage\n\u003c/code>\u003c/pre>\n\u003cp>Logs giúp đọc sự kiện; metrics giúp biết xu hướng và tỷ lệ; traces nối các bước của một thao tác. Khi qua queue, truyền correlation/trace context theo thiết kế và phân biệt từng attempt. Không dùng order ID, email hoặc workflow ID làm metric label có vô số giá trị; dùng log/trace có kiểm soát truy cập.\u003c/p>\n\u003ch2 id=\"monitoring-guide-s3\">3. Alert phải dẫn đến hành động\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Alert đề xuất\u003c/th>\n\u003cth>Điều kiện cần thống nhất\u003c/th>\n\u003cth>Owner / phản ứng\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Luồng nghiệp vụ không hoàn tất\u003c/td>\n\u003ctd>Success rate hoặc latency vi phạm mục tiêu trong cửa sổ đủ mẫu\u003c/td>\n\u003ctd>App/on-call xác minh impact, trace và thay đổi gần nhất\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Queue già đi\u003c/td>\n\u003ctd>Oldest task age vượt thời gian xử lý chấp nhận; backlog còn tăng\u003c/td>\n\u003ctd>Worker owner kiểm tra poller, rate limit, dependency và capacity\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Không có worker khả dụng\u003c/td>\n\u003ctd>Expected replicas &gt; 0 nhưng không có worker xử lý; hoặc mất heartbeat\u003c/td>\n\u003ctd>Platform + app kiểm tra scheduling, secret, image pull, startup\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>OOM/restart bất thường\u003c/td>\n\u003ctd>Số lần và xu hướng, đối chiếu rollout/maintenance\u003c/td>\n\u003ctd>Giữ previous logs, kiểm tra heap/job size/limit; tránh restart lặp mù quáng\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Không còn telemetry\u003c/td>\n\u003ctd>Không nhận log/metric/heartbeat trong thời gian dự kiến\u003c/td>\n\u003ctd>Kiểm tra collector/exporter/ingestion và workload; thiếu dữ liệu không phải số 0\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Mỗi alert có severity, service/site/environment, link dashboard/runbook, owner và escalation. Threshold CPU 80% hay memory 85% trong migration plan là gợi ý ban đầu; cần hiệu chỉnh theo baseline, duration và impact. Test cả đường gửi notification và xác nhận người nhận xử lý được.\u003c/p>\n\u003ch2 id=\"monitoring-guide-s4\">4. Runbook nhanh để lấy bằng chứng\u003c/h2>\n\u003cp>Các lệnh đọc bên dưới cần context và namespace đúng; thay \u003ccode>POD_NAME\u003c/code> bằng Pod đã xác định. Quyền đọc cluster, logs và metrics có thể khác nhau.\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">kubectl config current-context\nkubectl get pods -n maia-workflows -o wide\nkubectl describe pod POD_NAME -n maia-workflows\nkubectl logs POD_NAME -n maia-workflows --previous --timestamps --tail=200\nkubectl top pods -n maia-workflows\nkubectl get hpa -n maia-workflows\n\u003c/code>\u003c/pre>\n\u003cp>Context xác nhận cluster đang xem. \u003ccode>get\u003c/code> kiểm tra status/node/IP; \u003ccode>describe\u003c/code> xem Events và reason. \u003ccode>--previous\u003c/code> lấy log container trước lần restart (nếu còn); Pod nhiều container cần \u003ccode>-c\u003c/code>. \u003ccode>top\u003c/code> là ảnh chụp mức dùng hiện tại và cần Metrics API, không thay thế biểu đồ lịch sử. HPA có current/target/conditions; thiếu metrics không có nghĩa là workload đang nhàn.\u003c/p>\n\u003ch3 id=\"monitoring-guide-s5\">Cloud Logging · khoanh đúng workload\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">resource.type=\"k8s_container\"\nresource.labels.namespace_name=\"maia-workflows\"\nresource.labels.container_name=\"maia-wf-worker\"\n\u003c/code>\u003c/pre>\n\u003cp>Chọn project và time range trước khi chạy. Thêm severity sau khi biết log của app là structured hay text; text chứa chữ ERROR không bảo đảm severity đã được parse. Với ACA, mở runbook tổng hợp để dùng đúng table và query của workspace.\u003c/p>\n\u003ch2 id=\"monitoring-guide-s6\">5. Dashboard tối thiểu cho Maïa\u003c/h2>\n\u003col>\n\u003cli>Hàng đầu: số workflow, success rate (định nghĩa denominator), p95 startup/execution, oldest task age.\u003c/li>\n\u003cli>Hàng hai: replicas xử lý thật, active jobs, completion rate, retry và failure theo dependency.\u003c/li>\n\u003cli>Hàng ba: CPU/memory theo Pod, restarts/OOM, HPA desired/current, log lỗi và mốc rollout.\u003c/li>\n\u003cli>Bộ lọc: environment, deployment, service, version và time range đồng bộ. Không lấy trung bình các p95 để tính p95 toàn hệ thống.\u003c/li>\n\u003cli>Cost: retention, ingestion và chi phí cho workflow thành công. Giữ đủ evidence sự cố; loại secrets và dữ liệu khách hàng không cần thiết khỏi logs.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"monitoring-guide-s7\">6. Nhịp làm việc của Technical Advisor\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Hằng ngày:\u003c/strong> kiểm tra incident mở, backlog già và thay đổi lớn; lấy impact trước khi hỏi root cause.\u003c/li>\n\u003cli>\u003cstrong>Hằng tuần:\u003c/strong> review alert gây nhiễu, incident lặp lại, capacity trend, chi phí telemetry và action quá hạn.\u003c/li>\n\u003cli>\u003cstrong>Trước release:\u003c/strong> smoke test nghiệp vụ, baseline so sánh, owner, alert routing, rollback criterion.\u003c/li>\n\u003cli>\u003cstrong>Sau incident:\u003c/strong> timeline có timezone; facts/unknowns; fix có owner; một phép thử ngăn tái diễn.\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>We have confirmed the impact. The cause is still under review. Our next step is to check the backlog and the last release. I will update you at [time and time zone].\u003c/p>\n\u003c/blockquote>","sections":[{"id":"monitoring-guide-s0","title":"Monitoring · Nhìn từ kết quả nghiệp vụ xuống hạ tầng","text":" Thư mục Monitoring chưa có file nguồn tại lần tổng hợp 11/09/2026. Trang này là phần biên soạn bổ sung, liên kết với runbook ACA, tài liệu GCP và sách Production Kubernetes (chương 9, 14). Không có kết nối live hay số liệu production. "},{"id":"monitoring-guide-s1","title":"1. Bốn tầng cần xem cùng nhau","text":" Tầng Theo dõi Ý nghĩa và bước tiếp Nghiệp vụ Order/shipment/workflow hoàn tất, thời gian hoàn tất, dữ liệu bị trùng/sai Pod xanh nhưng đơn không hoàn tất vẫn là incident; chốt phạm vi site/khách hàng Ứng dụng Request rate, error rate, p95/p99, dependency timeout Trace từ API/worker qua SQL, HTTP và messaging để tìm đoạn chậm Queue/worker Oldest task age, backlog, throughput, active jobs, retries, poison tasks Queue tăng liên tục: so arrival rate với completion rate; CPU có thể vẫn thấp Nền tảng Ready replicas, restarts/OOM, CPU/memory, disk, network/DNS Đối chiếu requests/limits, event và deploy gần nhất; không đoán bottleneck chỉ từ một biểu đồ "},{"id":"monitoring-guide-s2","title":"2. Từ symptom đến evidence","text":" Business impact + timestamp + timezone\n  ├── Request / workflow ID → trace → dependency bị lỗi\n  ├── Version / revision → deployment gần nhất\n  ├── Queue age → throughput → worker concurrency\n  └── Pod / replica → events → logs trước restart → resource usage  Logs giúp đọc sự kiện; metrics giúp biết xu hướng và tỷ lệ; traces nối các bước của một thao tác. Khi qua queue, truyền correlation/trace context theo thiết kế và phân biệt từng attempt. Không dùng order ID, email hoặc workflow ID làm metric label có vô số giá trị; dùng log/trace có kiểm soát truy cập. "},{"id":"monitoring-guide-s3","title":"3. Alert phải dẫn đến hành động","text":" Alert đề xuất Điều kiện cần thống nhất Owner / phản ứng Luồng nghiệp vụ không hoàn tất Success rate hoặc latency vi phạm mục tiêu trong cửa sổ đủ mẫu App/on-call xác minh impact, trace và thay đổi gần nhất Queue già đi Oldest task age vượt thời gian xử lý chấp nhận; backlog còn tăng Worker owner kiểm tra poller, rate limit, dependency và capacity Không có worker khả dụng Expected replicas > 0 nhưng không có worker xử lý; hoặc mất heartbeat Platform + app kiểm tra scheduling, secret, image pull, startup OOM/restart bất thường Số lần và xu hướng, đối chiếu rollout/maintenance Giữ previous logs, kiểm tra heap/job size/limit; tránh restart lặp mù quáng Không còn telemetry Không nhận log/metric/heartbeat trong thời gian dự kiến Kiểm tra collector/exporter/ingestion và workload; thiếu dữ liệu không phải số 0  Mỗi alert có severity, service/site/environment, link dashboard/runbook, owner và escalation. Threshold CPU 80% hay memory 85% trong migration plan là gợi ý ban đầu; cần hiệu chỉnh theo baseline, duration và impact. Test cả đường gửi notification và xác nhận người nhận xử lý được. "},{"id":"monitoring-guide-s4","title":"4. Runbook nhanh để lấy bằng chứng","text":" Các lệnh đọc bên dưới cần context và namespace đúng; thay POD_NAME bằng Pod đã xác định. Quyền đọc cluster, logs và metrics có thể khác nhau.  kubectl config current-context\nkubectl get pods -n maia-workflows -o wide\nkubectl describe pod POD_NAME -n maia-workflows\nkubectl logs POD_NAME -n maia-workflows --previous --timestamps --tail=200\nkubectl top pods -n maia-workflows\nkubectl get hpa -n maia-workflows  Context xác nhận cluster đang xem. get kiểm tra status/node/IP; describe xem Events và reason. --previous lấy log container trước lần restart (nếu còn); Pod nhiều container cần -c . top là ảnh chụp mức dùng hiện tại và cần Metrics API, không thay thế biểu đồ lịch sử. HPA có current/target/conditions; thiếu metrics không có nghĩa là workload đang nhàn. "},{"id":"monitoring-guide-s5","title":"Cloud Logging · khoanh đúng workload","text":" resource.type=\"k8s_container\"\nresource.labels.namespace_name=\"maia-workflows\"\nresource.labels.container_name=\"maia-wf-worker\"  Chọn project và time range trước khi chạy. Thêm severity sau khi biết log của app là structured hay text; text chứa chữ ERROR không bảo đảm severity đã được parse. Với ACA, mở runbook tổng hợp để dùng đúng table và query của workspace. "},{"id":"monitoring-guide-s6","title":"5. Dashboard tối thiểu cho Maïa","text":" Hàng đầu: số workflow, success rate (định nghĩa denominator), p95 startup/execution, oldest task age. Hàng hai: replicas xử lý thật, active jobs, completion rate, retry và failure theo dependency. Hàng ba: CPU/memory theo Pod, restarts/OOM, HPA desired/current, log lỗi và mốc rollout. Bộ lọc: environment, deployment, service, version và time range đồng bộ. Không lấy trung bình các p95 để tính p95 toàn hệ thống. Cost: retention, ingestion và chi phí cho workflow thành công. Giữ đủ evidence sự cố; loại secrets và dữ liệu khách hàng không cần thiết khỏi logs. "},{"id":"monitoring-guide-s7","title":"6. Nhịp làm việc của Technical Advisor","text":" Hằng ngày: kiểm tra incident mở, backlog già và thay đổi lớn; lấy impact trước khi hỏi root cause. Hằng tuần: review alert gây nhiễu, incident lặp lại, capacity trend, chi phí telemetry và action quá hạn. Trước release: smoke test nghiệp vụ, baseline so sánh, owner, alert routing, rollback criterion. Sau incident: timeline có timezone; facts/unknowns; fix có owner; một phép thử ngăn tái diễn.  We have confirmed the impact. The cause is still under review. Our next step is to check the backlog and the last release. I will update you at [time and time zone]."}],"text":"Monitoring · Nhìn từ kết quả nghiệp vụ xuống hạ tầng Thư mục Monitoring chưa có file nguồn tại lần tổng hợp 11/09/2026. Trang này là phần biên soạn bổ sung, liên kết với runbook ACA, tài liệu GCP và sách Production Kubernetes (chương 9, 14). Không có kết nối live hay số liệu production. 1. Bốn tầng cần xem cùng nhau Tầng Theo dõi Ý nghĩa và bước tiếp Nghiệp vụ Order/shipment/workflow hoàn tất, thời gian hoàn tất, dữ liệu bị trùng/sai Pod xanh nhưng đơn không hoàn tất vẫn là incident; chốt phạm vi site/khách hàng Ứng dụng Request rate, error rate, p95/p99, dependency timeout Trace từ API/worker qua SQL, HTTP và messaging để tìm đoạn chậm Queue/worker Oldest task age, backlog, throughput, active jobs, retries, poison tasks Queue tăng liên tục: so arrival rate với completion rate; CPU có thể vẫn thấp Nền tảng Ready replicas, restarts/OOM, CPU/memory, disk, network/DNS Đối chiếu requests/limits, event và deploy gần nhất; không đoán bottleneck chỉ từ một biểu đồ 2. Từ symptom đến evidence Business impact + timestamp + timezone\n  ├── Request / workflow ID → trace → dependency bị lỗi\n  ├── Version / revision → deployment gần nhất\n  ├── Queue age → throughput → worker concurrency\n  └── Pod / replica → events → logs trước restart → resource usage Logs giúp đọc sự kiện; metrics giúp biết xu hướng và tỷ lệ; traces nối các bước của một thao tác. Khi qua queue, truyền correlation/trace context theo thiết kế và phân biệt từng attempt. Không dùng order ID, email hoặc workflow ID làm metric label có vô số giá trị; dùng log/trace có kiểm soát truy cập. 3. Alert phải dẫn đến hành động Alert đề xuất Điều kiện cần thống nhất Owner / phản ứng Luồng nghiệp vụ không hoàn tất Success rate hoặc latency vi phạm mục tiêu trong cửa sổ đủ mẫu App/on-call xác minh impact, trace và thay đổi gần nhất Queue già đi Oldest task age vượt thời gian xử lý chấp nhận; backlog còn tăng Worker owner kiểm tra poller, rate limit, dependency và capacity Không có worker khả dụng Expected replicas > 0 nhưng không có worker xử lý; hoặc mất heartbeat Platform + app kiểm tra scheduling, secret, image pull, startup OOM/restart bất thường Số lần và xu hướng, đối chiếu rollout/maintenance Giữ previous logs, kiểm tra heap/job size/limit; tránh restart lặp mù quáng Không còn telemetry Không nhận log/metric/heartbeat trong thời gian dự kiến Kiểm tra collector/exporter/ingestion và workload; thiếu dữ liệu không phải số 0 Mỗi alert có severity, service/site/environment, link dashboard/runbook, owner và escalation. Threshold CPU 80% hay memory 85% trong migration plan là gợi ý ban đầu; cần hiệu chỉnh theo baseline, duration và impact. Test cả đường gửi notification và xác nhận người nhận xử lý được. 4. Runbook nhanh để lấy bằng chứng Các lệnh đọc bên dưới cần context và namespace đúng; thay POD_NAME bằng Pod đã xác định. Quyền đọc cluster, logs và metrics có thể khác nhau. kubectl config current-context\nkubectl get pods -n maia-workflows -o wide\nkubectl describe pod POD_NAME -n maia-workflows\nkubectl logs POD_NAME -n maia-workflows --previous --timestamps --tail=200\nkubectl top pods -n maia-workflows\nkubectl get hpa -n maia-workflows Context xác nhận cluster đang xem. get kiểm tra status/node/IP; describe xem Events và reason. --previous lấy log container trước lần restart (nếu còn); Pod nhiều container cần -c . top là ảnh chụp mức dùng hiện tại và cần Metrics API, không thay thế biểu đồ lịch sử. HPA có current/target/conditions; thiếu metrics không có nghĩa là workload đang nhàn. Cloud Logging · khoanh đúng workload resource.type=\"k8s_container\"\nresource.labels.namespace_name=\"maia-workflows\"\nresource.labels.container_name=\"maia-wf-worker\" Chọn project và time range trước khi chạy. Thêm severity sau khi biết log của app là structured hay text; text chứa chữ ERROR không bảo đảm severity đã được parse. Với ACA, mở runbook tổng hợp để dùng đúng table và query của workspace. 5. Dashboard tối thiểu cho Maïa Hàng đầu: số workflow, success rate (định nghĩa denominator), p95 startup/execution, oldest task age. Hàng hai: replicas xử lý thật, active jobs, completion rate, retry và failure theo dependency. Hàng ba: CPU/memory theo Pod, restarts/OOM, HPA desired/current, log lỗi và mốc rollout. Bộ lọc: environment, deployment, service, version và time range đồng bộ. Không lấy trung bình các p95 để tính p95 toàn hệ thống. Cost: retention, ingestion và chi phí cho workflow thành công. Giữ đủ evidence sự cố; loại secrets và dữ liệu khách hàng không cần thiết khỏi logs. 6. Nhịp làm việc của Technical Advisor Hằng ngày: kiểm tra incident mở, backlog già và thay đổi lớn; lấy impact trước khi hỏi root cause. Hằng tuần: review raction?","What happens if the database commits but the side effect fails?"],"featured":true},{"id":"architecture-lab-agentic-workflow","source":"The Architecture Lab","category":"AI Engineering","published":"2026-04-24","title":".NET agentic development with supervised AI","url":"https://thearchitecturelab.com/post/agentic-workflow","summary":"The article combines project context, Jira integration, repeatable instructions, automated tests and human review. A failing test gives an agent a concrete target, while the engineer still checks scope and quality.","ta_view":"Treat this as one experience report rather than proof that the same workflow fits every project. For enterprise adoption, measure cycle time, review effort, escaped defects, rework and total AI cost. Keep approved tools, data boundaries and human approval for critical changes.","questions":["What project context is versioned and reviewed?","Which tests prove the requested behaviour instead of mirroring the implementation?","How do we detect scope growth, a flaky test or a false claim about a pre-existing failure?"],"featured":true},{"id":"architecture-lab-dotnet-roadmap","source":"The Architecture Lab","category":".NET","published":"2026-05-01","title":"A minimalist .NET learning roadmap","url":"https://thearchitecturelab.com/post/net-development-roadmap-minimalist-edition","summary":"Prioritise modern C# and AI usage, ASP.NET Core APIs, relational and non-relational data, testing, messaging, cloud, CI/CD, observability, containers, security and architectural decisions.","ta_view":"Use the roadmap as an index, then choose depth from current project risk. For this TA role, networking, identity, observability, AKS/GKE operations and failure handling deserve more time than another framework tutorial. Learning is complete only when it produces a review checklist, lab or incident diagnosis.","questions":["Which skill reduces the largest current delivery or production risk?","What practical output will prove the skill was learned?","Which topic can be deferred because another team owns it?"],"featured":true},{"id":"architecture-lab-clean-architecture","source":"The Architecture Lab","category":".NET & Architecture","published":"2026-05-29","title":"Five common Clean Architecture mistakes","url":"https://thearchitecturelab.com/post/deadly-clean-architecture-mistakes","summary":"Avoid excessive structure for a simple domain, infrastructure leakage into domain code, navigation organised only by technical layers, automatic mapping at every layer and business logic in controllers.","ta_view":"Review dependency direction and change cost, not folder count. Feature-based organisation can improve navigation, but shared policies and boundaries still need clear ownership. Add a DTO or mapping boundary when it protects a real external contract, security boundary or independent change rate.","questions":["Which expected change becomes easier because of this boundary?","Can a new developer find one business flow without opening every layer?","Does the domain depend on EF, HTTP, messaging or another framework?"],"featured":true},{"id":"kubernetes-blog-https-kubernetes-io-blog-2026-08-27-kubernetes-v1-37-metrics-api-ga","source":"Kubernetes Blog","category":"Kubernetes","published":"2026-08-27","title":"Kubernetes v1.37: Metrics API graduates to stable","url":"https://kubernetes.io/blog/2026/08/27/kubernetes-v1-37-metrics-api-ga/","summary":"Kubernetes v1.37 promotes the metrics.k8s.io API to stable ( v1 ). This API provides CPU and memory usage for nodes and Pods, and is the API behind commands such as kubectl top and resource-metrics-based autoscaling. For cluster operators and application developers, this graduation means that the API now has the stability guarantees associated with a Kubernetes stable API. The v1 API has the same resource types and fields as v1beta1 ; this is an API-version graduation, not a change to the metric","ta_view":"Với “Kubernetes v1.37: Metrics API gradua <script>
'use strict';
function languageCount(){return DB.language.conversations.length}
function dialogueCard(d){return `<article class="dialogue-card" id="dialogue-${d.id}"><header><div><span class="badge ${d.lang==='fr'?'blue':'green'}">${d.lang==='fr'?'FRANÇAIS A1':'ENGLISH'}</span><h2>${esc(d.title)}</h2></div><button data-dialogue-save="${d.id}" class="fav ${saved.includes('dialogue:'+d.id)?'on':''}" aria-label="Lưu hội thoại">${saved.includes('dialogue:'+d.id)?'★':'☆'}</button></header><p class="dialogue-context">${esc(d.context)}</p><div class="dialogue-lines">${d.lines.map((l,i)=>`<div class="dialogue-line ${l.who==='Bạn'?'mine':'theirs'}"><span>${esc(l.who)}</span><div><b>${esc(l.text)}</b><small>${esc(l.vi)}</small><button data-line-speak="${d.lang}" data-text="${esc(l.text)}" aria-label="Nghe câu">▷ Nghe</button></div></div>`).join('')}</div><div class="dialogue-follow"><b>Câu hỏi tiếp</b><span>${esc(d.follow)}</span><button data-line-speak="${d.lang}" data-text="${esc(d.follow)}">▷</button><b>Câu kết</b><span>${esc(d.exit)}</span><button data-line-speak="${d.lang}" data-text="${esc(d.exit)}">▷</button></div></article>`}
function conversationPage(id='all'){
 const groups=[['all','Tất cả'],['daily','Đồng nghiệp'],['lunch','Ăn trưa'],['family','Gia đình & du lịch'],['thursday','Tối thứ Năm'],['hq','Khách HQ'],['fr','Français A1']];
 const list=DB.language.conversations.filter(d=>id==='all'||d.group===id);
 return intro('LANGUAGE PRACTICE / ROLE PLAY','Mẫu hội thoại thực tế','Đọc vai “Bạn”, nghe câu của người đối diện rồi thay một chi tiết bằng trải nghiệm thật. Mẫu trả lời của sếp chỉ là tình huống luyện tập.')+`<div class="language-note"><b>Cách dùng trong 5 phút</b><span>1. Nghe một lượt → 2. Nói theo vai Bạn → 3. Đổi một thông tin → 4. Dùng câu hỏi tiếp hoặc câu kết.</span></div><div class="tabs">${groups.map(([gid,name])=>`<button data-convtab="${gid}" class="${id===gid?'selected':''}">${name}</button>`).join('')}</div><div class="dialogue-grid">${list.map(dialogueCard).join('')}</div>`+footer()
}
function frPhraseCard(p){return `<article class="card phrase"><div class="eyebrow">FRANÇAIS PRATIQUE · A1</div><p class="english">${esc(p.text)}</p><p class="vietnamese">${esc(p.vi)}</p><div class="pace"><span class="eyebrow" style="color:#6f8067">NHỊP NÓI GỢI Ý</span><br>${esc(p.pace)}</div><div class="phraseactions"><button data-line-speak="fr" data-text="${esc(p.text)}">▷ Nghe chậm</button><button data-langcopy="${esc(p.text)}">Sao chép FR</button></div></article>`}
function frenchPage(){
 const weeks=DB.language.weeks,phrases=DB.language.frPhrases,frDialogs=DB.language.conversations.filter(d=>d.lang==='fr');
 return intro('FRANÇAIS / 3–6 MONTHS','Tiếng Pháp tự học A1','Dùng 19 bài phát âm làm nền, bổ sung từ vựng, ngữ pháp và bốn kỹ năng để có thể giao tiếp cơ bản trong bữa trưa sau 3–6 tháng.')+`<div class="fr-hero"><div><span class="badge blue">OBJECTIF A1</span><h2>12 tuần nền tảng<br>+ 12 tuần củng cố</h2><p>30 phút/ngày, 5 ngày/tuần. Mỗi tuần phải có nghe, nói, đọc và viết; cuối tuần có một đầu ra quan sát được.</p></div><div><b>Đích thực dụng</b><p>Chào hỏi, giới thiệu, gọi món, hỏi giờ, nói về cuối tuần và gia đình, xin nhắc lại, duy trì hội thoại 2–3 phút khi người đối diện nói chậm.</p><b>Đích kiểm tra</b><p>Làm một bài mẫu DELF A1 từ nguồn chính thức. Tự học không đồng nghĩa đã có chứng chỉ.</p></div></div><div class="sectionhead"><h2>Lộ trình 12 tuần</h2><span>Tháng 1 nền tảng · Tháng 2 giao tiếp · Tháng 3 tích hợp</span></div><div class="week-grid">${weeks.map(w=>`<details class="week-card" ${Number(w.week)<=2?'open':''}><summary><span>Tuần ${w.week}</span><b>${w.title}</b></summary><div><h3>Học gì</h3><p>${w.study}</p><h3>Luyện 4 kỹ năng</h3><p>${w.practice}</p><h3>Đầu ra cuối tuần</h3><p>${w.check}</p></div></details>`).join('')}</div><div class="month46"><h2>Tháng 4–6 · biến kiến thức thành phản xạ</h2><div><section><b>Mỗi tuần</b><p>2 buổi nghe A1 có transcript · 2 buổi shadowing 10 phút · 1 buổi hội thoại 15–30 phút với giáo viên/partner · 1 tin nhắn 40–60 từ.</p></section><section><b>Mỗi tháng</b><p>Làm lại một bài mẫu tương đương · thu âm cùng chủ đề cũ · so lỗi nghe, phát âm, ngữ pháp và tốc độ phản hồi.</p></section><section><b>Tại bàn ăn</b><p>Mỗi tuần dùng 2 câu mới với sếp. Khi kẹt, xin nhắc lại hoặc chuyển sang tiếng Anh; không cố kéo dài bằng câu chưa chắc nghĩa.</p></section></div></div><div class="sectionhead"><h2>46 câu dùng ngay</h2><span>Giọng fr-FR của trình duyệt · dùng “vous” với sếp</span></div><div class="phrasegrid">${phrases.map(frPhraseCard).join('')}</div><div class="sectionhead"><h2>8 hội thoại mẫu</h2><button data-go="conversations" data-id="fr">Mở toàn bộ role play →</button></div><div class="dialogue-grid">${frDialogs.slice(0,2).map(dialogueCard).join('')}</div><div class="fr-resources"><h2>Tự kiểm tra A1</h2><p>France Éducation international cung cấp thông tin và đề mẫu DELF A1; phần viết có một bài điền form và một tin nhắn tối thiểu 40 từ. TV5MONDE có bài học video miễn phí theo trình độ. Các link cần Internet.</p><a href="https://www.france-education-international.fr/diplome/delf-tout-public/niveau-a1?langue=fr" target="_blank" rel="noopener noreferrer">DELF A1 chính thức ↗</a><a href="https://france-education-international.fr/diplome/delf-tout-public/niveau-a1/exemples-sujets?langue=fr" target="_blank" rel="noopener noreferrer">Đề mẫu A1 ↗</a><a href="https://apprendre.tv5monde.com/" target="_blank" rel="noopener noreferrer">TV5MONDE Apprendre ↗</a></div>`+footer()
}
function frenchSourcePage(){const d=DB.docs.find(d=>d.id==='french-source');return `<div class="toolbar"><button data-go="french">← Lộ trình A1</button><a href="${encodeURI(d.file)}" target="_blank" rel="noopener noreferrer">Mở file gốc ↗</a><button id="printpage" style="margin-left:auto">In trang</button></div>${intro('FRENCH SOURCE / ORIGINAL LAYOUT',d.title,d.desc)}<div class="callout"><b>Bản gốc được giữ nguyên</b>Trang nguồn có kế hoạch 4 tuần và các nút phát âm riêng. Lộ trình 12–24 tuần nằm ở mục Tiếng Pháp A1.</div><iframe class="french-frame" id="frenchframe" sandbox="allow-scripts" title="Le Français Facile — tài liệu gốc"></iframe>`+footer()}
function languageSearch(query){const ts=norm(query).split(/\s+/).filter(Boolean),rows=[];for(const d of DB.language.conversations){const hay=norm(d.title+' '+d.context+' '+d.follow+' '+d.exit+' '+d.lines.map(x=>x.text+' '+x.vi).join(' '));if(ts.every(t=>hay.includes(t)))rows.push(`<button class="result" data-go="conversations" data-id="${d.group}"><span class="badge green">HỘI THOẠI / ${d.lang==='fr'?'FR':'EN'}</span><b>${esc(d.title)}</b><p>${esc(d.context)}</p></button>`)}for(const p of DB.language.frPhrases){if(ts.every(t=>norm(p.text+' '+p.vi).includes(t)))rows.push(`<button class="result" data-go="french"><span class="badge blue">FRANÇAIS A1</span><b>${esc(p.text)}</b><p>${esc(p.vi)}</p></button>`)}return rows.length?`<div class="sectionhead"><h2>Ngôn ngữ & hội thoại · ${rows.length} kết quả</h2></div><div class="results">${rows.join('')}</div>`:''}
function speakLanguage(lang,text){if(!('speechSynthesis' in window)){toast('Trình duyệt chưa hỗ trợ đọc câu.');return}const u=new SpeechSynthesisUtterance(text);u.lang=lang==='fr'?'fr-FR':'en-US';u.rate=lang==='fr'?.72:.78;const voices=speechSynthesis.getVoices(),v=voices.find(v=>v.lang===u.lang)||voices.find(v=>v.lang.startsWith(lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}
function initLanguage(page){if(page==='french-source')document.getElementById('frenchframe').srcdoc=DB.docs.find(d=>d.id==='french-source').raw;const root=document.getElementById('content');if(!root.dataset.languageBound){root.addEventListener('click',languageClick,true);root.dataset.languageBound='true'}}
function languageClick(e){const t=e.target.closest('button');if(!t)return;if(t.dataset.lineSpeak){e.stopPropagation();speakLanguage(t.dataset.lineSpeak,t.dataset.text);return}if(t.dataset.langcopy){e.stopPropagation();copyText(t.dataset.langcopy);return}if(t.dataset.convtab){e.stopPropagation();route('conversations',t.dataset.convtab);return}if(t.dataset.dialogueSave){e.stopPropagation();const id='dialogue:'+t.dataset.dialogueSave;saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];persist();render();return}}

const KCON=[
{id:'pod',name:'Pod',tag:'Đơn vị chạy ứng dụng',intro:'Một Pod có thể chứa app và sidecar. Các container trong Pod chia sẻ mạng và có thể gọi nhau qua localhost.',steps:['Một Pod, một network namespace','App gọi sidecar qua localhost','Hai container dùng volume chung','Pod thay thế có thể nhận IP mới'],explain:['App và sidecar dùng chung Pod IP 10.1.0.7, nhưng lắng nghe ở các port khác nhau.','Request đi từ app:8080 tới sidecar:9000 qua localhost; không cần một Service giữa hai container cùng Pod.','Volume được khai báo ở Pod và mount vào từng container. Chia sẻ volume không có nghĩa mọi thư mục đều dùng chung.','Pod cũ bị thay thế bởi Pod mới do controller quản lý. Không hard-code Pod IP cho ứng dụng khác gọi vào.'],case:'API shipment và sidecar hỗ trợ chạy trong cùng Pod. Restart một container không nhất thiết thay Pod; tạo Pod thay thế là lifecycle khác.',risk:'Mô phỏng Pod thông thường, không dùng hostNetwork. IP có thể được tái sử dụng; không coi IP là định danh bền vững.',cmd:'kubectl get pods -n logistics -o wide\nkubectl describe pod <pod-name> -n logistics\nkubectl logs <pod-name> -n logistics -c app',read:'Đọc IP, node, từng container, volume mount và restart count. Thay <pod-name> bằng tên Pod thực tế.',refs:[['Pods','https://kubernetes.io/docs/concepts/workloads/pods/']]},
{id:'deployment',name:'Deployment',tag:'Rolling update có kiểm soát',intro:'Deployment quản lý ReplicaSet để giữ số Pod mong muốn và thay dần phiên bản ứng dụng.',steps:['3 Pod v1 đang Ready','Tạo thêm 1 Pod v2','v2 Ready, giảm 1 Pod v1','Lặp lại với Pod v2 tiếp theo','Hoàn tất: 3 Pod v2'],explain:['Mục tiêu replicas=3; ví dụ dùng maxSurge=1 và maxUnavailable=0. Đây là cấu hình minh họa, không phải mặc định.','Tổng cộng 4 Pod. Pod v2 đang khởi động, chưa nhận traffic; 3 Pod v1 tiếp tục phục vụ.','Sau khi v2 sẵn sàng, Deployment giảm ReplicaSet cũ. Trong mô hình này vẫn giữ 3 Pod Ready.','Controller tiếp tục tạo Pod mới rồi giảm Pod cũ theo giới hạn rollout; không sửa image bên trong Pod cũ.','ReplicaSet mới giữ đủ 3 Pod v2. Xác minh cả request nghiệp vụ, lỗi và latency, không chỉ trạng thái rollout.'],case:'Triển khai orders-api v2 mà vẫn giữ khả năng phục vụ trong lúc từng Pod mới khởi động.',risk:'Readiness sai hoặc thiếu node capacity có thể làm rollout kẹt. Rollback image không tự rollback schema database. Thời gian termination thực tế không được mô phỏng.',cmd:'kubectl rollout status deployment/orders-api -n logistics\nkubectl get rs,pods -n logistics\nkubectl describe deployment orders-api -n logistics',read:'Xem desired/current/ready, ReplicaSet mới/cũ và Events. rollout status là thao tác theo dõi, không deploy.',refs:[['Deployments','https://kubernetes.io/docs/concepts/workloads/controllers/deployment/']]},
{id:'service',name:'Service',tag:'Địa chỉ ổn định, backend thay đổi',intro:'Service ClusterIP cung cấp địa chỉ ổn định trong cluster. Selector và EndpointSlice xác định các backend phù hợp.',steps:['3 backend Ready','Request tới một backend','Pod B mất Ready','Pod D thay thế và Ready'],explain:['Service orders có ClusterIP 10.96.0.7 trong ví dụ. EndpointSlice có ba địa chỉ backend.','Một kết nối được chuyển tới backend phù hợp. Hình minh họa không cam kết thuật toán round-robin cho từng request.','Với cấu hình thông thường, backend không Ready không nhận kết nối mới qua Service sau khi endpoint cập nhật.','Controller tạo Pod thay thế; khi Pod D Ready, EndpointSlice cập nhật. Client vẫn dùng tên Service hoặc ClusterIP cũ.'],case:'Warehouse API gọi orders.logistics.svc.cluster.local thay vì lưu Pod IP.',risk:'Service không tạo Pod, không tự restart container. Client đang giữ kết nối cũ có thể cần reconnect; DNS/IP ổn định trong vòng đời Service, không bảo đảm sau xóa và tạo lại.',cmd:'kubectl get svc orders -n logistics\nkubectl get endpointslice -n logistics -l kubernetes.io/service-name=orders\nkubectl get pods -n logistics --show-labels',read:'So selector của Service với label Pod; kiểm tra address, port và ready của EndpointSlice.',refs:[['Service','https://kubernetes.io/docs/concepts/services-networking/service/']]},
{id:'ingress',name:'Ingress',tag:'Route HTTP theo host và path',intro:'Ingress khai báo rule HTTP/HTTPS. Ingress controller thực thi rule và gửi request đến Service tương ứng.',steps:['Host đúng, path /api/orders','Host đúng, path /shop','Host không khớp rule','Rule không tạo controller'],explain:['Host logistics.example.com và prefix /api khớp rule → orders-svc → Pod backend.','Cùng host, path /shop chọn web-svc. Một điểm vào có thể phục vụ nhiều ứng dụng.','Không khớp host/path: request đi tới default backend nếu được cấu hình; ví dụ này trả 404.','Chỉ tạo Ingress resource chưa đủ. Cluster cần một Ingress controller đang hoạt động và có đường mạng tới backend.'],case:'Portal logistics và API dùng cùng hostname, tách bằng path; kiểm tra Host header trước khi kết luận Pod lỗi.',risk:'Ingress không tự mở mọi port TCP/UDP. TLS, DNS, load balancer và controller cần cấu hình riêng; hình chỉ minh họa HTTP routing.',cmd:'kubectl get ingress -n logistics\nkubectl describe ingress logistics -n logistics\nkubectl get svc,endpointslice -n logistics',read:'Đọc host/path, ingressClass, backend service/port và Events. Xác nhận controller của class đang chạy.',refs:[['Ingress','https://kubernetes.io/docs/concepts/services-networking/ingress/']]},
{id:'config',name:'ConfigMap & Secret',tag:'Tách cấu hình khỏi image',intro:'ConfigMap lưu cấu hình không nhạy cảm. Secret dùng cho dữ liệu nhạy cảm; base64 chỉ là encoding, không phải mã hóa bảo mật.',steps:['Cấu hình và secret được tách riêng','Pod nhận config qua tham chiếu','ConfigMap được cập nhật','Env cần Pod/container khởi tạo lại'],explain:['Ví dụ chỉ dùng dữ liệu giả. ConfigMap chứa LOG_LEVEL; Secret chứa API_KEY và phải được kiểm soát quyền truy cập.','Ứng dụng có thể nhận dữ liệu qua environment hoặc volume. Hình này chọn environment để thấy rõ thời điểm nạp giá trị.','ConfigMap đổi từ info sang debug nhưng environment của container đang chạy vẫn giữ giá trị cũ.','Pod thay thế nạp environment mới khi container khởi tạo. Chỉ sửa ConfigMap không tự tạo rollout Deployment.'],case:'Cùng image orders-api, mỗi môi trường dùng cấu hình phù hợp và tham chiếu secret riêng.',risk:'Không coi base64 là bảo vệ secret. Với volume mount, cập nhật có thể lan truyền trễ và app phải đọc lại; subPath không tự nhận update. Áp dụng RBAC và mã hóa lưu trữ phù hợp.',cmd:'kubectl get configmap app-config -n logistics\nkubectl describe configmap app-config -n logistics\nkubectl get secret api-credentials -n logistics',read:'Xem metadata, key và cấu hình không nhạy cảm; không dump secret bằng -o yaml hoặc decode giá trị vào log.',refs:[['ConfigMaps','https://kubernetes.io/docs/concepts/configuration/configmap/'],['Secrets','https://kubernetes.io/docs/concepts/configuration/secret/']]},
{id:'hpa',name:'Replicas & Autoscaling',tag:'HPA tăng Pod, không trực tiếp tăng node',intro:'HPA điều chỉnh số replica từ metrics. Với CPU utilization, tỷ lệ được so với CPU requests, không phải CPU limit.',steps:['2 Pod • CPU trung bình 35%','Tải tăng • CPU trung bình 90%','HPA đề xuất 3 replica','Pod thứ 3 Ready • đo lại metrics'],explain:['Target CPU=60%, min=2, max=6 trong ví dụ. CPU 35% chưa yêu cầu tăng số Pod.','Metrics báo CPU trung bình 90% so với requests. Controller HPA đánh giá theo chu kỳ, không phản ứng tức thì.','Mô hình đơn giản: ceil(2 × 90 / 60)=3. HPA thay desired replicas; Deployment/ReplicaSet tạo thêm Pod.','Replica mới nhận tải sau khi Ready. CPU 60% ở đây là số minh họa cho tải phân bố đều; thực tế phải đo lại.'],case:'API xử lý đơn hàng tăng tải trong giờ cut-off. HPA tăng replica khi metrics và cấu hình cho phép.',risk:'Cần metrics API và CPU requests. Tolerance, missing metrics, stabilization và scaling policies ảnh hưởng quyết định. Nếu thiếu chỗ trên node, Pod mới vẫn Pending; node autoscaler là cơ chế khác.',cmd:'kubectl get hpa -n logistics\nkubectl describe hpa orders-api -n logistics\nkubectl top pods -n logistics',read:'So current/target, desired/current replicas và Conditions. top pods cần metrics API khả dụng.',refs:[['Horizontal Pod Autoscaling','https://kubernetes.io/docs/concepts/workloads/autoscaling/horizontal-pod-autoscale/'],['Node autoscaling','https://kubernetes.io/docs/concepts/cluster-administration/node-autoscaling/']]},
{id:'scheduler',name:'The Scheduler',tag:'Filter → score → bind',intro:'Scheduler chọn node cho Pod chưa được gán node. Nó xét requests và constraints, rồi chấm điểm các node phù hợp.',steps:['Pod Pending • request 2 GiB','Filter: loại node không phù hợp','Score: so các node còn lại','Bind: gán Pod vào node C'],explain:['Pod mới cần 2 GiB memory request. Pod chưa có nodeName và đang đợi scheduler.','Node A chỉ còn 1 GiB allocatable chưa được request; node B có taint mà Pod không tolerate. C và D qua bước lọc.','C và D được chấm điểm theo plugins/chính sách scheduler. Điểm 85 và 60 ở đây chỉ là minh họa.','Scheduler bind Pod vào C. Kubelet trên C sẽ kéo image và khởi động container; bind xong chưa có nghĩa app đã Ready.'],case:'Pod Pending dù dashboard CPU node thấp: requests, taints hoặc affinity có thể không cho đặt Pod.',risk:'Không chọn node chỉ theo RAM/CPU đang dùng. Còn volume, affinity, topology và constraints khác. Scheduler không tự tạo VM/node.',cmd:'kubectl describe pod <pending-pod> -n logistics\nkubectl get nodes\nkubectl describe node <node-name>',read:'Tìm FailedScheduling trong Events: Insufficient memory/cpu, untolerated taint, affinity hoặc volume conflict.',refs:[['Kubernetes Scheduler','https://kubernetes.io/docs/concepts/scheduling-eviction/kube-scheduler/']]},
{id:'node',name:'Node',tag:'Máy chạy Pod và báo trạng thái',intro:'Node có kubelet, container runtime và thành phần mạng. Heartbeat/Lease giúp control plane theo dõi sức khỏe node.',steps:['Node Ready • heartbeat đều','Mất liên lạc heartbeat','Sau timeout • Ready=Unknown','Taints ngăn xếp Pod thông thường mới'],explain:['Kubelet gửi trạng thái và gia hạn Lease. Node chạy nhiều Pod, phụ thuộc capacity và scheduling constraints.','Control plane chưa có đủ bằng chứng node chết ngay khi bỏ lỡ một heartbeat. Container có thể vẫn đang chạy ở node bị mất liên lạc.','Sau thời gian cấu hình, node controller có thể đánh dấu Ready=Unknown khi không nhận được cập nhật.','Taint unreachable/not-ready ảnh hưởng scheduling; tolerations và chính sách eviction quyết định các Pod hiện có bị xử lý khi nào.'],case:'Nhiều service cùng lỗi trên một node: kiểm tra node health, network và Events trước khi sửa từng app.',risk:'Mất heartbeat không đồng nghĩa mọi Pod được chuyển ngay. Hình không mô phỏng thời gian eviction, phân vùng mạng hoặc volume detach/attach; workload cần chống xử lý trùng.',cmd:'kubectl get nodes\nkubectl describe node <node-name>\nkubectl get pods -A -o wide --field-selector spec.nodeName=<node-name>',read:'Đọc Conditions, taints, pressure và các Pod cùng node. Quan sát timestamp trước khi liên hệ nhiều incident.',refs:[['Nodes','https://kubernetes.io/docs/concepts/architecture/nodes/']]},
{id:'probes',name:'Liveness & Readiness',tag:'Nhận traffic khác với restart',intro:'Readiness quyết định Pod có sẵn sàng nhận traffic. Liveness thất bại đủ ngưỡng dẫn tới restart container.',steps:['Startup chưa xong • chưa Ready','Startup OK • Pod Ready','Readiness fail • ngừng traffic mới','Liveness fail đủ ngưỡng • restart','Container trở lại • Ready lại'],explain:['Ví dụ có startupProbe. Khi chưa thành công, kubelet chưa chạy liveness/readiness probes; startup cũng có ngưỡng thất bại riêng.','Startup thành công, readiness đạt: Pod có thể được chọn làm backend. Container restart count=0.','Readiness fail loại Pod khỏi backend sẵn sàng thông thường, nhưng không tự restart container. Restart count vẫn bằng 0.','Liveness fail đạt failureThreshold: kubelet restart container theo chính sách. Mô phỏng dùng failureThreshold=3.','Container khởi động, vượt startup/readiness rồi mới nhận traffic trở lại. Restart count=1 trong cùng Pod.'],case:'App còn sống nhưng chưa sẵn sàng phục vụ: dùng readiness. Process bị kẹt không tự hồi phục có thể cần liveness.',risk:'Không dùng sự cố SQL ngắn hạn để làm mọi liveness fail và gây restart hàng loạt. Startup probe hết ngưỡng cũng có thể restart container.',cmd:'kubectl describe pod <pod-name> -n logistics\nkubectl logs <pod-name> -n logistics --previous\nkubectl get endpointslice -n logistics',read:'Đối chiếu probe failure Events, Ready, restart count và log container trước. --previous chỉ có dữ liệu khi có instance trước đó.',refs:[['Liveness, Readiness & Startup Probes','https://kubernetes.io/docs/concepts/workloads/pods/probes/']]},
{id:'namespace',name:'Namespace',tag:'Cùng tên, khác phạm vi',intro:'Namespace chia phạm vi tên cho nhiều loại resource. orders trong dev và orders trong prod là hai Service khác nhau.',steps:['dev và prod có orders riêng','kubectl -n dev chọn dev','kubectl -n prod chọn prod','Namespace không tự chặn network'],explain:['Mỗi namespace có Deployment, Service và quota riêng nếu được cấu hình. Node là resource cấp cluster, không nằm trong namespace.','Flag -n dev chỉ chọn phạm vi cho command đó. Lệnh đọc không thay đổi cấu hình ứng dụng.','Flag -n prod chọn tài nguyên khác dù tên Service giống nhau. Luôn xác nhận cả context và namespace.','Phân tách tên không đồng nghĩa network isolation. Cần NetworkPolicy và CNI hỗ trợ enforcement để kiểm soát traffic theo chính sách.'],case:'Các team có môi trường dev/prod riêng về tên và quyền; cần RBAC, quota và chính sách mạng theo yêu cầu thực tế.',risk:'Namespace không thay thế tenant isolation đầy đủ. Context trỏ nhầm cluster vẫn nguy hiểm dù namespace đúng; ServiceAccount cũng có phạm vi namespace.',cmd:'kubectl config current-context\nkubectl get svc orders -n dev\nkubectl get svc orders -n prod\nkubectl get resourcequota,networkpolicy -n prod',read:'So context, namespace, ClusterIP và policy hiện có. Sự tồn tại của NetworkPolicy chưa chứng minh CNI đang enforce đúng.',refs:[['Namespaces','https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/']]}
];

const kPalette={blue:'#70ccff',green:'#69dfb6',purple:'#b6a0ff',red:'#ff91a6',amber:'#f4cf7b',muted:'#92a5bd'};
function kt(x,y,t,color='muted',size=13,anchor='start'){return `<text x="${x}" y="${y}" fill="${kPalette[color]||color}" font-size="${size}" text-anchor="${anchor}">${esc(t)}</text>`}
function kb(x,y,w,h,title,sub='',color='blue',extra=''){return `<g class="k-enter"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="9" fill="${kPalette[color]}0d" stroke="${kPalette[color]}" stroke-width="1.4" ${extra}/>${kt(x+w/2,y+(sub?22:h/2+5),title,color,14,'middle')}${sub?kt(x+w/2,y+43,sub,'muted',11,'middle'):''}</g>`}
function kl(x,y,xx,yy,color='blue',moving=false){const path=`M${x} ${y} L${xx} ${yy}`;return `<path d="${path}" stroke="${kPalette[color]}" stroke-width="1.5" fill="none" ${moving?'stroke-dasharray="6 6" class="k-flowline"':''}/>${moving?`<circle r="4" fill="${kPalette[color]}" class="k-packet" style="offset-path:path('${path}')"/>`:''}`}

if(window.mermaid)mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'neutral',flowchart:{htmlLabels:false,useMaxWidth:true},suppressErrorRendering:true});
async function renderMermaid(){
 if(!window.mermaid)return;
 const nodes=[...document.querySelectorAll('.reading code.language-mermaid')];
 for(let i=0;i<nodes.length;i++){
  const code=nodes[i],text=code.textContent,wrap=code.closest('.codewrap')||code.closest('pre');if(!wrap?.isConnected)continue;
  try{const result=await mermaid.render('md-'+Date.now()+'-'+i,text);if(!wrap.isConnected)continue;const box=document.createElement('div');box.className='source-diagram';box.innerHTML=result.svg;wrap.before(box);const details=document.createElement('details');details.className='diagram-source';details.innerHTML='<summary>Xem mã Mermaid</summary>';wrap.before(details);details.append(wrap)}catch(e){const note=document.createElement('p');note.className='muted';note.textContent='Sơ đồ chưa render được; giữ mã Mermaid bên dưới để đối chiếu.';wrap.before(note)}
 }
}

async function ensureArchiveManifest(id){const state=archiveState(id);if(state.meta)return state.meta;await loadArchiveScript(id,'manifest.js');state.meta=window.TIP_ARCHIVE_META?.[id];if(!state.meta)throw new Error('Archive manifest không hợp lệ: '+id);return state.meta}

async function loadMoreTips(button){const id=activeArchiveId(),state=id?archiveState(id):null;if(state?.loading)return;const visible=Math.min(tipLimit,currentTipCount()),target=visible+12;if(button){button.disabled=true;button.textContent='Đang tải…'}if(state)state.loading=true;try{while(id&&currentTipCount()<target&&archiveHasMore(id)){const added=await loadArchiveChunk(id);if(!added&&!archiveHasMore(id))break}tipLimit=target}catch(error){if(state)state.error=String(error.message||error);toast('Không tải được archive. Kiểm tra thư mục work/Tips/archive.')}finally{if(state)state.loading=false;render()}}
